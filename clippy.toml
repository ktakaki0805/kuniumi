# Determinism guard rails. See docs/conventions.md, "Determinism".
#
# Transcendental functions from std call the platform's libm, whose results can
# differ in the last bits between operating systems and CPUs. They are banned
# everywhere; use the deterministic implementations in `kuniumi_math::det`.
# Basic arithmetic, `sqrt` and `mul_add` are IEEE 754 correctly rounded and allowed.
disallowed-methods = [
    { path = "f64::sin", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::cos", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::tan", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::sin_cos", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::asin", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::acos", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::atan", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::atan2", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::sinh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::cosh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::tanh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::asinh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::acosh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::atanh", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::exp", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::exp2", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::exp_m1", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::ln", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::ln_1p", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::log", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::log2", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::log10", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::powf", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::powi", reason = "precision is unspecified and can change with optimisation; multiply explicitly" },
    { path = "f64::cbrt", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "f64::hypot", reason = "platform libm is not bit-reproducible; use kuniumi_math::det" },
    { path = "std::thread::available_parallelism", reason = "work partitioning must not depend on the machine; use fixed chunk sizes" },
]

# std's hash containers iterate in a per-process random order, which silently
# breaks seed reproducibility. Use Vec, sorted Vec or BTreeMap/BTreeSet.
# f32 is reserved for the future GPU path; the CPU reference path is f64 only.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order breaks determinism; use Vec or BTreeMap" },
    { path = "std::collections::HashSet", reason = "random iteration order breaks determinism; use Vec or BTreeSet" },
    { path = "f32", reason = "the CPU reference path is f64 only (f32 is reserved for the GPU path)" },
]
