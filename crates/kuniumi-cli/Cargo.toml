[package]
name = "kuniumi-cli"
description = "Command-line interface for the kuniumi planet generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kuniumi"
path = "src/main.rs"

[dependencies]
kuniumi-config.workspace = true
kuniumi-io.workspace = true
kuniumi-math.workspace = true
kuniumi-sim.workspace = true
kuniumi-sphere.workspace = true
kuniumi-world.workspace = true
# Command-line parsing (D-10). Not on the generation path, so not pinned to
# an exact version.
clap = { version = "4.6.7", features = ["derive"] }

[lints]
workspace = true
