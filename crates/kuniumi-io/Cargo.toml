[package]
name = "kuniumi-io"
description = "File formats and image output for kuniumi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuniumi-math.workspace = true
# The validation metrics of `metrics.txt` (D-06: kuniumi-io may depend on
# kuniumi-sim, never the other way round).
kuniumi-sim.workspace = true
kuniumi-sphere.workspace = true
kuniumi-world.workspace = true
# Compressed PNG output (D-10). Not on the generation path: the golden tests
# fingerprint the pixel buffers, never the compressed bytes, so it is not
# pinned to an exact version.
png = "0.18.1"
# `world.json` (D-10), through mirror structs in `world_dir`, so that serde
# stays out of kuniumi-world and kuniumi-sim. Not on the generation path: the
# metadata is written from finished worlds and its numbers are checked to
# parse back bit for bit, so neither is pinned to an exact version. The bytes
# of `world.json` do depend on serde_json's float formatter (older releases
# wrote `1.335e18` where 1.0.154 writes `1.335e+18`), so an upgrade may change
# them; the byte-exact layout tests of `world_dir` decide, as the pixel
# fingerprints do for `png`.
# `float_roundtrip` makes serde_json's parser return every f64 exactly.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[lints]
workspace = true
