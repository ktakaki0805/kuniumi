[package]
name = "kuniumi-sphere"
description = "Spherical point sets, Delaunay/Voronoi and the cell grid for kuniumi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kuniumi-math.workspace = true
# Exact orient3d (D-10, D-14): Shewchuk's adaptive predicates, transcribed from
